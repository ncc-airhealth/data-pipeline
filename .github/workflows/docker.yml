name: Publish Docker base

on:
  push:
    branches: ['**']
    tags: ['docker/v*']
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_call:
    inputs:
      container_version:
        description: 'Container version to publish from docker/v<version>'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      container_version:
        description: 'Container version to publish; leave empty to test only'
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ncc-airhealth/data-pipeline/base
  TEST_TAG: ghcr.io/ncc-airhealth/data-pipeline/base:test

concurrency:
  group: docker-base-${{ inputs.container_version && format('refs/tags/docker/v{0}', inputs.container_version) || github.ref }}
  cancel-in-progress: ${{ inputs.container_version == '' && github.ref_type != 'tag' }}

jobs:
  publish_docker:
    name: Build, test and publish Docker base
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.container_version && format('refs/tags/docker/v{0}', inputs.container_version) || github.ref }}

      - name: Resolve container version
        id: version
        env:
          CONTAINER_VERSION: ${{ inputs.container_version }}
          GIT_TAG: ${{ github.ref_name }}
          TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/docker/v') }}
        run: |
          publish=false
          version="test"
          if [[ -n "$CONTAINER_VERSION" || "$TAG_PUSH" == true ]]; then
            version="${CONTAINER_VERSION:-${GIT_TAG#docker/v}}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo '::error::Use a container version such as 1.0.0.'
              exit 1
            fi
            publish=true
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

      - name: Prevent version overwrite
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_token="$(curl --fail --silent --show-error \
            --user "$GHCR_USERNAME:$GHCR_TOKEN" \
            --get --data-urlencode "service=$REGISTRY" \
            --data-urlencode "scope=repository:$IMAGE_NAME:pull" \
            "https://$REGISTRY/token" | jq -er '.token')"
          echo "::add-mask::$registry_token"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $registry_token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://$REGISTRY/v2/$IMAGE_NAME/manifests/$VERSION")"
          case "$status" in
            404) ;;
            200) echo "::error::Container version $VERSION already exists."; exit 1 ;;
            *) echo "::error::Cannot check container version (HTTP $status)."; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.TEST_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base-amd64
          cache-to: type=gha,scope=base-amd64,mode=max

      - name: Test Docker image
        run: |
          docker run --rm -i --platform linux/amd64 "$TEST_TAG" sh -e <<'SH'
          python -c 'import platform, sys; assert platform.machine() == "x86_64"; assert sys.version_info[:3] == (3, 12, 15), sys.version; print(sys.version)'
          weed version
          pixi --version
          uv --version
          uvx --version
          fusermount --version
          uv venv /tmp/smoke-venv --python /usr/local/bin/python
          /tmp/smoke-venv/bin/python -c 'import ssl; print(ssl.OPENSSL_VERSION)'
          SH

      - name: Push tested Docker image
        if: steps.version.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          docker tag "$TEST_TAG" "$IMAGE"
          docker push "$IMAGE"

      - name: Record published digest
        if: steps.version.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          manifest_digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er '
            if has("manifests") then
              [.manifests[] | select(.platform.os == "linux")]
              | if length == 1 and .[0].platform.architecture == "amd64" then
                  .[0].digest
                else error("Expected only linux/amd64") end
            else .digest end
          ')"
          printf '%s\n' "Published: $IMAGE" "" 'Use this reference in each workspace:' "" \
            '```dockerfile' "FROM $IMAGE@$manifest_digest" '```' "" \
            'Build and run with --platform linux/amd64.' >> "$GITHUB_STEP_SUMMARY"
